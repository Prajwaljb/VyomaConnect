[package]
name = "vyoma-windows"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Vyoma's PC side on Windows: pairs with and serves Vyoma on your phone, on vyoma-core and vyoma-engine"

[[bin]]
name = "vyoma-windows"
path = "src/main.rs"

# Everything is Windows-only: elsewhere the program just says where Vyoma's PC side is.
# Windows' own APIs (MIT/Apache-2.0); the phone's Home stats and About this PC (MIT), screenshots as PNG (MIT/Apache-2.0).
[target.'cfg(windows)'.dependencies]
anyhow = "1.0.104"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vyoma-core = { path = "../core" }
vyoma-engine = { path = "../engine", features = ["phone-files"] }
# The camera for apps (vyoma_camera.dll, camera/, its own crate): Windows' camera service loads the
# DLL; the agent shares its frame code.
vyoma-camera = { path = "camera" }
sysinfo = "0.40.0"
# The controller driver download's SHA-256 (Apache-2.0/ISC, as core's).
ring = "0.17.14"
# Windows' COM and WinRT APIs (MIT/Apache-2.0): media controls, Core Audio, toasts, screen capture,
# Media Foundation's H.264 encoder, the firewall, UI Automation (handoff's address bar).
# windows-core: for #[implement] (COM objects Windows calls: the toasts' buttons).
windows-core = "0.62"
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "UI_Notifications",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Rpc",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Notifications",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
png = "0.17"
windows-sys = { version = "0.61", features = [
    "Win32_Devices_Bluetooth",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Tests decode the touchpad's key as the phone does (MIT/Apache-2.0, already core's).
[target.'cfg(windows)'.dev-dependencies]
base64 = "0.23"

# The icon inside the program (MIT).
[build-dependencies]
embed-resource = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
