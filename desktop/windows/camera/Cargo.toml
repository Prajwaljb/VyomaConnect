[package]
name = "vyoma-camera"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Vyoma Phone Camera: the media source Windows 11's camera service loads (vyoma_camera.dll)"

# A crate of its own with only Windows' API crates, so it's quick to build for both processors the
# camera service runs on: x64, and ARM64 (Snapdragon PCs), where the service is native and can't
# load an x64 DLL even though the rest of Vyoma runs there under emulation. The agent uses it too
# (the frame code it writes the phone's pictures with).
[lib]
name = "vyoma_camera"
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

# Windows' APIs (MIT/Apache-2.0): COM, Media Foundation, the shared section.
[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
