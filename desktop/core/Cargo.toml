[package]
name = "vyoma-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Vyoma's desktop protocol core: identity, KDE Connect links and payloads, with no desktop calls"

[dependencies]
anyhow = "1.0.104"
libc = "0.2.191"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4"] }
