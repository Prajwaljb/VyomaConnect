[package]
name = "vyoma-companion"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
vyoma-core = { path = "../core" }
anyhow = "1.0.104"
base64 = "0.23"
futures-util = { version = "0.3", default-features = false }
hex = "0.4.3"
mdns-sd = "0.21.6"
p256 = { version = "0.14", features = ["ecdsa", "pem"] }
ring = "0.17"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
libc = "0.2.191"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = "1"
serde_json = "1.0.154"
sha2 = "0.11"
sysinfo = "0.40.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
zbus = { version = "6", default-features = false, features = ["tokio", "service"] }
# 1.22: the mirror window's key modifiers and scrolls. No higher, so Debian 12 and Ubuntu 24.04 build it.
gstreamer = { version = "0.25", features = ["v1_22"] }
gstreamer-video = { version = "0.25", features = ["v1_22"] }
gstreamer-gl = { version = "0.25", features = ["v1_22"] }
x11rb = { version = "0.13", features = ["xtest", "xfixes", "randr", "shape", "dpms"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
