[package]
name = "vyoma-companion"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
hex = "0.4.3"
mdns-sd = "0.21.6"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde_json = "1.0.154"
sha2 = "0.10"
sysinfo = "0.40.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
