[package]
name = "vyoma-mac"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Vyoma's PC side on macOS: pairs with and serves Vyoma on your phone, on vyoma-core"

[dependencies]
anyhow = "1.0.104"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vyoma-core = { path = "../core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
