[package]
name = "vyoma-engine"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Vyoma's PC side once for every platform: what each phone request does, permits, activity, what to offer; each OS supplies a Platform"

[dependencies]
vyoma-core = { path = "../core" }
anyhow = "1.0.104"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
# The phone's files in the window (`phone-files`, the Mac and Windows; Linux mounts them with sshfs):
# an SFTP client on ring, as the rest. Both Apache-2.0.
russh = { version = "=0.65.1", default-features = false, features = ["ring", "rsa"], optional = true }
russh-sftp = { version = "=3.0.1", optional = true }

[features]
phone-files = ["dep:russh", "dep:russh-sftp"]

[profile.release]
lto = "thin"
