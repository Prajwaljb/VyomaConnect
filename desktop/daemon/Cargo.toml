[package]
name = "vyoma-desktop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Vyoma's standalone desktop app: pairs and talks with phones on its own, no kdeconnectd needed"

[dependencies]
vyoma-core = { path = "../core" }
vyoma-companion = { path = "../companion" }
anyhow = "1.0.104"
futures-util = { version = "0.3", default-features = false }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "6", default-features = false, features = ["tokio", "service"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
