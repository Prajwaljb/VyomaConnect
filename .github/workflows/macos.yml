# The macOS side, built and tested where there's a Mac: GitHub's macOS runners (Apple silicon).
# Nobody on the project has a Mac yet, so this is the only place macOS code runs: it builds the
# shared core, the Mac daemon and Vyoma's window, and runs their tests. It's no stand-in for trying it on a real Mac.
# Vyoma.app (window + daemon, universal, signed with Vyoma's own key or ad-hoc) is kept as a download for whoever tries
# it on one. For a release (called by desktop-release.yml after it makes the draft, or run by hand with
# `release`), it builds that tag and attaches Vyoma-mac-<version>.zip and its .sha256 to the release.
name: macOS

on:
  push:
    branches: [main]
    paths: ["desktop/**", "packaging/bundle-mac.sh", "VERSION", ".github/workflows/macos.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to build and attach Vyoma.app to (e.g. v0.11.0); empty for a plain build"
        required: false
        default: ""
  workflow_call:
    inputs:
      release:
        type: string
        required: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release || github.ref }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/core/target
            desktop/engine/target
            desktop/mac/target
            desktop/gui/target
          key: macos-${{ hashFiles('desktop/core/Cargo.toml', 'desktop/engine/Cargo.toml', 'desktop/mac/Cargo.lock', 'desktop/gui/Cargo.lock') }}
      - name: Test vyoma-core
        working-directory: desktop/core
        run: cargo test --release
      # What every PC side shares: each phone request's handling, switches, Activity, what's offered.
      - name: Test vyoma-engine
        working-directory: desktop/engine
        run: cargo test --release
      - name: Test vyoma-mac
        working-directory: desktop/mac
        run: cargo test --release
      # The window talks to vyoma-mac over its socket (gui/src/socket.rs).
      - name: Test the window
        working-directory: desktop/gui
        run: cargo test --release
      # Vyoma's own signing key, if the repo has it (packaging/mac-signing-key.sh), in a keychain of
      # its own for this run.
      - name: Signing key
        env:
          P12: ${{ secrets.MAC_SIGN_P12 }}
          PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "no signing key: ad-hoc"; exit 0; }
          kc=$RUNNER_TEMP/vyoma.keychain-db kcpw=$(openssl rand -hex 16)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/vyoma.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/vyoma.p12" -k "$kc" -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/vyoma.p12"
          echo "VYOMA_SIGN_IDENTITY=Vyoma Mac Signing" >> "$GITHUB_ENV"
      - name: Build Vyoma.app (universal)
        working-directory: desktop
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          mkdir -p out
          for crate in gui:vyoma mac:vyoma-mac; do
            dir=${crate%%:*} bin=${crate#*:}
            (cd $dir && cargo build --release --target aarch64-apple-darwin && cargo build --release --target x86_64-apple-darwin)
            lipo -create -output out/$bin $dir/target/aarch64-apple-darwin/release/$bin $dir/target/x86_64-apple-darwin/release/$bin
            lipo -info out/$bin
          done
          ../packaging/bundle-mac.sh out/vyoma out/vyoma-mac out
          ditto -c -k --sequesterRsrc --keepParent out/Vyoma.app out/Vyoma-mac.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Vyoma-mac
          path: desktop/out/Vyoma-mac.zip
      - name: Attach to the release
        if: inputs.release
        working-directory: desktop/out
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          version=${TAG#v}
          [ "$(tr -d '[:space:]' < ../../VERSION)" = "$version" ] || { echo "VERSION isn't $version"; exit 1; }
          cp Vyoma-mac.zip "Vyoma-mac-$version.zip"
          shasum -a 256 "Vyoma-mac-$version.zip" > "Vyoma-mac-$version.zip.sha256"
          cat "Vyoma-mac-$version.zip.sha256"
          gh release upload "$TAG" "Vyoma-mac-$version.zip" "Vyoma-mac-$version.zip.sha256" --clobber
